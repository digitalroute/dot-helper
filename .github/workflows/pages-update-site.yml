name: PoC - IntelliJ plugin update site (GitHub Pages)

# Proof of concept for digitalroute/dr-platform-team#178/#186: publish an
# IntelliJ plugin "update site" (an updatePlugins.xml index plus the
# plugin ZIP it points at) over HTTPS via GitHub Pages, using the
# artifact-based Pages deploy (no publishing branch).
#
# This repo is a content bucket: the site under site/ is committed
# content (a release workflow in digitalroute/dot-lab6 is expected to
# push real builds here), and this workflow only deploys whatever is
# committed there. It does not build or sign the plugin - the content in
# site/ today is a placeholder, not a signed release.
#
# Out of scope for this PoC: real plugin signing, custom domain, and the
# dot-lab6 release workflow that produces site/'s content.
#
# CI-only publishing: this workflow is the only writer of the Pages
# deployment, but there is no publishing *branch* to protect under the
# actions/deploy-pages model (GitHub stores the deployment itself, not a
# branch). The equivalent control is a repo-admin setting, not a file in
# this tree - see the "CI-only publishing" section in README.md for the
# exact steps to apply by hand.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pages-update-site.yml"
      - "site/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
